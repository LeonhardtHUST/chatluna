$inner:
    - {}
    - $desc: 'Search Service Configuration'
      searchEngine:
          $desc: 'Search engine'
      topK: 'Number of reference results (2-50)'
      enhancedSummary: 'Enable enhanced summary'
      fastEnhancedSummary: 'Enable fast enhanced summary. This will not call the model and directly return the search results. (Requires a larger context model)'
      contextualCompression: 'Enable contextual compression. Will compress the search results based on the selected summary model.'
      summaryModel: 'Model used for generating summaries. Opting for a smaller and faster model can yield quicker responses.'
      summaryType:
          $desc: 'Summary mode. Different summary modes can improve the quality of information.'
          $inner:
              - 'Performance mode. Focuses on quick information retrieval.'
              - 'Balanced mode. Strikes a balance between information retrieval and information quality.'
              - 'Quality mode. Focuses on obtaining high-quality information.'
      searchThreshold: 'Similarity threshold for search content. Higher values mean more likely to search.'
      searchTriggerKeywords: 'Mechanical search trigger keywords. Separate keywords with half-width commas.'
      enableFastNonBrowsingSkip: 'Enable fast path for simple non-browsing requests. Matching requests skip the search router model and go directly to the main model.'
      simpleNonBrowsingPhrases: 'Simple non-browsing phrases. Separate phrases with half-width commas. Exact matches skip the search router model.'
      fastSkipStableTaskKeywords: 'Stable local-task keywords. Matching requests skip the search router model unless an exclusion keyword is also present.'
      fastSkipStableTaskExcludeKeywords: 'Stable local-task fast-path exclusions. Prevents skipping external-fact requests such as latest info, official docs, versions, APIs, URLs, or source checks.'
      fastSkipNumericOnly: 'Skip the search router model for numeric-only short messages.'
      enableSafeSearchSyntaxSkip: 'Enable fast path for search-syntax explanation requests. This is only for stable compliance explanations and does not override latest, official, case, or source-verification search intent.'
      safeSearchSyntaxTerms: 'Search-syntax explanation topic terms. Separate terms with half-width commas.'
      safeSearchSyntaxContextKeywords: 'Search-syntax explanation context keywords. Topic and context keywords must both match before skipping the search router.'
      safeSearchSyntaxExcludeKeywords: 'Search-syntax fast-path exclusion keywords. Matching requests return to normal search-router judgment.'
      safeSearchSyntaxSearchIntentKeywords: 'Explicit search-intent keywords. Matching requests return to normal search-router judgment for latest policies, cases, official docs, or source verification.'
      multiSourceMode:
          $desc: 'Multi-source mode.'
          $inner:
              - 'Average mode. Takes an average number of search results from each source.'
              - 'Sum mode. Combines search results from multiple sources and takes the top K results.'

    - $desc: 'Browser Settings'
      enableBrowser: 'Enable browser features. Required for browser tools, URL browsing, Bing (Web), and Google (Web).'
      browserTimeout: 'Browser operation timeout (ms)'
      browserIdleTimeout: 'Browser idle timeout (ms)'
      browserMaxPages: 'Maximum browser pages per conversation'
      browserOutputLimit: 'Maximum browser tool output length before saving to file'

    - $desc: 'Serper Settings'
      serperApiKey: 'Serper API key'
      serperCountry: 'Serper search country'
      serperLocation: 'Serper search location'
      serperSearchResults: 'Number of Serper search results'

    - $desc: 'Bing API Settings'
      bingSearchApiKey: 'Bing API key'
      bingSearchLocation: 'Bing API search location'
      azureLocation: 'Azure API search location'

    - $desc: 'Tavily Settings'
      tavilyApiKey: 'Tavily API key'

    - $desc: 'Wikipedia Settings'
      wikipediaBaseURL: 'Wikipedia API base URL'
      maxWikipediaDocContentLength: 'Wikipedia document content maximum length'

    - $desc: 'SearxNG Settings'
      searxngBaseURL: 'SearxNG API base URL'

    - $desc: 'Advanced Settings'
      searchPrompt: 'Search prompt. Used for summarizing search results.'
      newQuestionPrompt: 'New question prompt. Used for generating new questions.'
      summaryPrompt: 'Summary prompt. Used for summarizing documents.'
      searchFailedPrompt: 'Prompt returned to the model when search fails. If empty, nothing is returned.'
      contextualCompressionPrompt: 'Contextual compression prompt. Used for compressing search results based on the selected summary model.'
