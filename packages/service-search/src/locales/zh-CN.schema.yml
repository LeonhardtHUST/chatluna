$inner:
    - {}
    - $desc: 搜索服务配置
      searchEngine:
          $desc: 搜索引擎。
      topK: 参考结果数量（2-50）。
      enhancedSummary: 是否使用增强摘要。
      fastEnhancedSummary: 是否使用快速增强摘要。开启后将不调用模型，直接返回搜索结果。（需要上下文较大的模型）
      summaryModel: 处理摘要和关键词的模型。选择较小并且速度较快的模型可以获得更快的响应速度。
      searchConfidenceThreshold: 搜索决策的置信阈值。较高的值意味着更可能进行搜索。
      contextualCompression: 是否对搜索结果进行上下文压缩。将会基于选择的摘要模型对搜索结果进行压缩。
      summaryType:
           $desc: 摘要模式。不同的摘要模式可以提高信息的质量。
           $inner:
                - 性能模式。注重快速的信息获取。
                - 平衡模式。在信息获取和信息质量之间取得平衡。
                - 质量模式。注重高信息质量的获取。
      searchThreshold: 搜索内容的相似度阈值。
      maxRouterSearchQueries: 搜索路由最多生成的搜索查询数量。较小的值可降低延迟，但可能减少召回。
      searchTriggerKeywords: 机械搜索触发关键词。每个关键词之间使用半角逗号分隔。
      enableFastNonBrowsingSkip: 启用简单非浏览请求快路径。命中后跳过搜索路由模型，直接交给主模型回答。
      simpleNonBrowsingPhrases: 简单非浏览短句。每个短句之间使用半角逗号分隔，完全匹配后跳过搜索路由模型。
      fastSkipStableTaskKeywords: 稳定本地任务关键词。命中且未命中排除词时跳过搜索路由模型。
      fastSkipStableTaskExcludeKeywords: 稳定本地任务快路径排除词。用于避免跳过最新信息、官网、版本、API、URL 等外部事实请求。
      fastSkipNumericOnly: 纯数字短消息跳过搜索路由模型。
      enableSafeSearchSyntaxSkip: 启用搜索语法讲解快路径。仅用于稳定的合规讲解，不覆盖最新、官方、案例或来源核验类搜索需求。
      safeSearchSyntaxTerms: 搜索语法讲解主题词。每个词之间使用半角逗号分隔。
      safeSearchSyntaxContextKeywords: 搜索语法讲解上下文词。命中主题词和上下文词时才可能跳过搜索路由。
      safeSearchSyntaxExcludeKeywords: 搜索语法快路径排除词。命中后交回正常搜索路由判断。
      safeSearchSyntaxSearchIntentKeywords: 显式搜索意图词。命中后交回正常搜索路由判断，避免跳过最新政策、案例、官方说明或来源核验。
      multiSourceMode:
          $desc: 多源模式。
          $inner:
              - 平均模式。将多个来源的搜索结果各取平均个。
              - 总和模式。将多个来源的搜索结果进行总和后取前 topK 个。
      providerTimeoutMs: 单个搜索源的超时时间（毫秒）。超时后返回已有结果。
      searchEarlyReturnResults: 多搜索源模式下达到该结果数后可提前返回。


    - $desc: 浏览器设置
      enableBrowser: 是否启用浏览器功能。浏览器工具、URL 浏览、Bing (Web) 和 Google (Web) 需要开启。
      browserTimeout: 浏览器操作超时时间（毫秒）。
      browserIdleTimeout: 浏览器空闲超时时间（毫秒）。
      browserMaxPages: 每个会话最多保留的浏览器页面数量。
      browserOutputLimit: 浏览器工具输出保存到文件前的最大文本长度。

    - $desc: Serper 设置
      serperApiKey: Serper API 密钥。
      serperCountry: Serper 搜索国家。
      serperLocation: Serper 搜索地区。
      serperSearchResults: Serper 搜索返回结果数量。

    - $desc: Bing API 设置
      bingSearchApiKey: Bing API 密钥。
      bingSearchLocation: Bing API 搜索地区。
      azureLocation: Azure API 搜索地区。

    - $desc: Tavily 设置
      tavilyApiKey: Tavily API 密钥。

    - $desc: Wikipedia 设置
      wikipediaBaseURL: Wikipedia API 基础 URL。
      maxWikipediaDocContentLength: Wikipedia 文档内容最大长度。

    - $desc: SearxNG 设置
      searxngBaseURL: SearxNG API 基础 URL。

    - $desc: 进阶设置
      searchPrompt: 搜索提示词。用于对搜索结果总结的 Prompt。
      newQuestionPrompt: 新问题提示词。用于生成新问题的 Prompt。
      summaryPrompt: 文档总结提示词。用于总结文档的 Prompt。
      searchFailedPrompt: 搜索失败时返回给模型的提示词。为空则不返回。
      contextualCompressionPrompt: 上下文压缩提示词。用于压缩搜索结果上下文的 Prompt。
