$inner:
    - $desc: Bot Configuration
      botNames: Set the bot's name. (Only the first name is the actual bot name; other names are only used to trigger conversations.)
      truncateBotNames: Remove the matched bot name from the beginning of the message before sending it to the model.
      isNickname: Allow matching bot nickname at the beginning of a message to trigger a conversation.
      isNickNameWithContent: Allow matching bot nickname anywhere in the message content to trigger a conversation.

    - $desc: Conversation Behavior
      allowPrivate: Enable private chat conversations.
      allowAtReply: Enable @mention triggering.
      allowQuoteReply: Enable quote triggering.
      privateChatWithoutCommand: Enable direct conversation in private chats without commands.
      allowConversationTriggerPrefix: 'Enable conversation title prefix triggering. Note: May impact performance significantly. Recommended for use with filters in specific groups only.'
      randomReplyFrequency: Set random reply frequency (0-100, where 0 means never and 100 means always).
      includeQuoteReply: Include quoted message content in requests sent to the model.
      attachForwardMsgIdToContext: Attach forward message record IDs to context. When enabled, a "[聊天记录]" marker message will be appended if forward records are detected.

    - isForwardMsg: Send bot replies as forwarded messages.
      forwardMsgMinLength: Set minimum length of forwarded messages (characters).

    - isReplyWithAt: Quote the original message when the bot replies.
      replyQuoteThreshold: Minimum response time required to quote the original message. Set to 0 to always apply. When greater than 0, the original message will only be quoted if the response time exceeds this threshold.

    - $desc: Response Options
      sendThinkingMessage: Send waiting message during processing.
      sendThinkingMessageTimeout: Set timeout (ms) for waiting message dispatch.
      thinkingMessage: Customize waiting message content.
      msgCooldown: Set global message cooldown (seconds) to limit adapter calls.
      messageQueue: Enable message queue. When enabled, if multiple messages are sent and the model has not responded to the initial message, the messages will be cached and merged into one message, and will be sent after waiting for the model response.
      messageQueueDelay: Set message queue delay time (seconds). Set to 0 to disable delay. When delay is enabled, the system will wait for the specified time before sending messages to the model. If there are unprocessed messages during this period, they will be cached and merged into multiple messages to send to the model.
      agentTaskAutoWakeup: Automatically wake up the conversation when a background agent task finishes. Disable to return to manual status checks.
      showThoughtMessage: Display thinking message in plugin mode or reasoner model.

    - $desc: Message Rendering
      outputMode:
          $desc: Select message reply rendering mode.
      splitMessage: 'Enable message splitting. Splits replies into multiple messages for natural conversation flow. Note: Incompatible with quoted messages, raw mode, or image mode. Stream response enables finer-grained splitting.'
      censor: Enable text moderation (requires censor service).
      rawOnCensor: Whether to send the raw message to the model when the Post Handler is triggered.
      streamResponse: 'Enable stream response. Initiates message sending during reply generation. Note: Disables rendering output mode and incompatible with plugin mode.'

    - $desc: Blacklist Management
      blackList: Configure blacklist. Use cautiously to avoid unintended blocking. The number 1 indicates enabled blacklist. Set to zero value to unenable blacklist.

    - $desc: History Management
      infiniteContext: Enable automatic Infinite Context compression when history nears the model limit. Preserves critical topics and instructions while discarding noise.
      infiniteContextThreshold: Set the threshold (percentage) for triggering Infinite Context compression. Compression will be triggered when the token count of conversation history reaches this percentage of the model's context limit.
      autoArchive: Enable automatic archiving of inactive conversations instead of keeping legacy room state alive.
      autoArchiveTimeout: Set inactivity threshold for conversation archiving in seconds.
      autoPurgeArchive: Enable automatic deletion of archived conversations after the purge timeout.
      autoPurgeArchiveTimeout: Set how long archived conversations are retained before automatic purge in seconds.

    - $desc: Model Configuration
      defaultEmbeddings: Set default embedding model.
      defaultVectorStore: Set default vector database.

    - $desc: Conversation Routing Defaults
      defaultGroupRouteMode:
          $desc: Set the default conversation route mode for group chats. This controls whether group members share one conversation route or get personal routes, including preset-lane routes.
          $inner:
              - Shared group conversation
              - Personal conversation per member
      defaultChatMode: Set default chat mode.
      defaultModel: Set default chat model.
      defaultPreset: Set default chat preset.

    - $desc: Miscellaneous
      errorTemplate: Set error prompt message template (subject to change).
      voiceSpeakId: Set default speaker ID for vits service.
      isLog: Enable debug mode.

    - $desc: Moderation
      moderation:
          enabled: Enable the moderation kernel service.
          shadowMode: Record moderation decisions without enforcing block or suspend actions. Disable only after reviewing logs and false positives.
          inputEnabled: Evaluate user input before model, search, or tool execution.
          preSearchEnabled: Evaluate search and URL browsing requests before external fetching.
          outputEnabled: Evaluate and optionally transform generated replies before sending.
          backend:
              $desc: Moderation backends
              useKoishiCensor: Reuse Koishi censor service for output text transformation when available.
              useKeywordRules: Enable deterministic local keyword and policy rules.
              useLlmRecheck: Enable LLM secondary review for review decisions. Disabled by default.
              recheckModel: LLM secondary review model. Leave empty to use the ChatLuna default model.
          storage:
              $desc: Moderation storage and privacy
              storeRawTextForAppeal: Store raw evidence text for appeal review. Disabled by default for privacy.
              rawTextRetentionDays: Number of days to retain raw evidence when raw storage is enabled.
              eventRetentionDays: Reserved event metadata retention window in days. Event deletion must preserve review references.
              redactBeforePersist: Store coarse redacted evidence metadata instead of raw text when raw storage is disabled.
          enforcement:
              $desc: Moderation enforcement
              fixedBlockReply: Fixed reply sent when moderation blocks a request in enforce mode.
              maxRechecksPerRequest: Maximum secondary review attempts for one request.
          rules:
              $desc: Local keyword rules
              blockKeywordGroups: Keyword groups that produce block decisions.
              reviewKeywordGroups: Keyword groups that produce review decisions.
              shortKeywordContextRules:
                  $desc: Short keyword context rules. Prevents short terms from being blocked by raw substring matches. Bare short terms can at most enter review unless context rules match.
                  term: Short keyword term.
                  blockIfPrecededBy: Upgrade to block when the term is immediately preceded by these words. Separate with half-width commas.
                  blockIfFollowedBy: Upgrade to block when the term is immediately followed by these words. Separate with half-width commas.
                  ignoreIfFollowedBy: Ignore the match when the term is immediately followed by these words. Separate with half-width commas.
                  standaloneAction: Action for standalone short-term matches. Only allow or review is supported; direct block is not allowed.
              promptAttackWarning: Safety warning injected into review prompts to treat prompt-injection text as untrusted user content.
          compatibility:
              $desc: Legacy compatibility mapping
              mapCoreCensor: Map legacy ChatLuna censor settings into moderation output behavior.
              mapSearchSafetyConfig: Map legacy search-service safety settings into moderation rules.

    - isProxy:
          $desc: Enable proxy for ChatLuna family plugin network requests.
          $inner:
              - true
      proxyAddress: Set proxy address for network requests. Falls back to Koishi global proxy settings if cleared.
